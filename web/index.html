<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WizEngine</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sbHead">
      <span class="sbTitle">WizEngine</span>
      <span id="camLabel" class="sbSub"></span>
      <button id="sbClose" onclick="toggleSidebar()" title="Hide sidebar (Tab)">‹</button>
    </div>

    <div class="sbTabs">
      <button id="tabScene" class="sbTab active" onclick="showTab('scene')">Scene</button>
      <button id="tabPhysics" class="sbTab" onclick="showTab('physics')">Physics</button>
    </div>

    <div id="paneScene" class="sbPane">
    <div class="sbRow playRow">
      <button id="btnPlay" class="wide" onclick="togglePause()">⏸&#xFE0E; Pause</button>
      <button class="wide" onclick="send('reset')">⟲ Reset</button>
    </div>
    <div id="simTime" title="Simulated time (resets with ⟲)">t = 0.00 s</div>

    <section class="sbSec" data-sec="cameras">
      <div class="sbSecHead" onclick="toggleSection('cameras')">
        <span><span class="caret"></span>Cameras</span>
      </div>
      <div class="secBody">
        <div id="camList" class="list"></div>
      </div>
    </section>
    <div class="rowResize" data-resize="cameras" title="Drag to resize"></div>

    <section class="sbSec" data-sec="objects">
      <div class="sbSecHead" onclick="toggleSection('objects')">
        <span><span class="caret"></span>Objects</span>
        <span id="objCount" class="sbCount"></span>
      </div>
      <div class="secBody">
        <input id="objFilter" class="filter" placeholder="filter by index…">
        <div id="objList" class="list scroll"></div>
      </div>
    </section>

    <div class="rowResize" data-resize="objects" title="Drag to resize"></div>

    <section class="sbSec" data-sec="events">
      <div class="sbSecHead" onclick="toggleSection('events')">
        <span><span class="caret"></span>Events</span>
        <span class="sbCount" id="evtClear"
              onclick="event.stopPropagation(); clearEvents()">clear</span>
      </div>
      <div class="secBody">
        <div id="evtList" class="list scroll evtList"></div>
      </div>
    </section>
    <div class="rowResize" data-resize="events" title="Drag to resize"></div>

    <section class="sbSec" data-sec="inspector">
      <div class="sbSecHead" onclick="toggleSection('inspector')">
        <span><span class="caret"></span>Inspector</span>
      </div>
      <div class="secBody">
        <div id="inspector" class="inspector">nothing selected</div>
      </div>
    </section>
    <div class="rowResize" data-resize="inspector" title="Drag to resize"></div>
    </div><!-- /paneScene -->

    <div id="panePhysics" class="sbPane" hidden>
      <section class="sbSec">
        <div class="sbSecHead">Solver</div>
        <div class="tuneRow">
          <span>iterations <b class="val" id="iterVal">-</b></span>
          <span class="btns">
            <button onclick="bumpIter(-20)">-20</button>
            <button onclick="bumpIter(20)">+20</button>
          </span>
        </div>
        <div class="tuneRow">
          <span>substeps <b class="val" id="subVal">-</b></span>
          <span class="btns">
            <button onclick="send('substeps', {n:1})">1</button>
            <button onclick="send('substeps', {n:2})">2</button>
            <button onclick="send('substeps', {n:3})">3</button>
            <button onclick="send('substeps', {n:4})">4</button>
          </span>
        </div>
      </section>

      <section class="sbSec">
        <div class="sbSecHead">Rate</div>
        <div class="tuneRow">
          <span>physics Hz <b class="val" id="hzVal">-</b></span>
          <span class="btns">
            <button onclick="send('rate', {hz:30})">30</button>
            <button onclick="send('rate', {hz:60})">60</button>
            <button onclick="send('rate', {hz:120})">120</button>
          </span>
        </div>
      </section>

      <section class="sbSec">
        <div class="sbSecHead">Contacts</div>
        <div class="tuneRow">
          <span>envelope <b class="val" id="envVal">-</b></span>
          <span class="btns">
            <button onclick="send('envelope', {m:0.005})">.005</button>
            <button onclick="send('envelope', {m:0.01})">.01</button>
            <button onclick="send('envelope', {m:0.02})">.02</button>
            <button onclick="send('envelope', {m:0.05})">.05</button>
          </span>
        </div>
        <div class="tuneRow">
          <span>recovery <b class="val" id="recVal">-</b></span>
          <span class="btns">
            <button onclick="send('recovery', {v:0.1})">0.1</button>
            <button onclick="send('recovery', {v:0.3})">0.3</button>
            <button onclick="send('recovery', {v:1.0})">1.0</button>
            <button onclick="send('recovery', {v:3.0})">3.0</button>
          </span>
        </div>
      </section>
    </div><!-- /panePhysics -->
  </aside>

  <div id="sbResize" title="Drag to resize the panel"></div>

  <button id="sbOpen" onclick="toggleSidebar()" title="Show sidebar (Tab)">☰</button>

  <main id="main">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="loading"><div class="spin"></div><span>connecting…</span></div>
    <div id="hit"></div>
    <svg id="cursor" viewBox="0 0 24 24" aria-hidden="true">
      <path class="curArrow"
            d="M5 2 L5 19 L9.5 15.2 L12.2 21.5 L15 20.3 L12.3 14.2 L18 14 Z"
            fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/>
      <g class="curCross">
        <path d="M12 3 V21 M3 12 H21" fill="none" stroke="#000"
              stroke-width="3.4" stroke-linecap="round"/>
        <path d="M12 3 V21 M3 12 H21" fill="none" stroke="#fff"
              stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </svg>
    <button id="fsBtn" onclick="toggleFullscreen()" title="Fullscreen (Alt+F)">⛶ Fullscreen</button>
    <div id="error">
      <div class="title">別のブラウザが接続中です</div>
      <div class="body">この映像は同時に1つのブラウザまでしか表示できません。
      先に接続しているブラウザを閉じると、この画面は自動的に再接続します。</div>
    </div>
  </div>
  <div id="perf">measuring...</div>
  <div id="link">connecting...</div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
